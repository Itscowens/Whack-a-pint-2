
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Whack a Pint!</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  background: #103c30;
  color: #fff5d6;
  font-family: system-ui, Arial, sans-serif;
  touch-action: none;
}
#game {
  display: block;
  width: 100vw;
  height: 100dvh;
  touch-action: none;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
  background: radial-gradient(
    circle at 50% 30%, #328059, #103c30 75%
  );
  z-index: 5;
}
.hidden { display: none !important; }
h1 {
  font-size: clamp(48px, 14vw, 85px);
  line-height: .94;
  margin: 10px 0 25px;
  text-shadow: 5px 5px #09261e;
  transform: rotate(-3deg);
}
h1 span { color: #ffce49; }
.panel {
  background: #fff2d2;
  color: #203329;
  border: 4px solid #1b2923;
  border-radius: 22px;
  padding: 20px;
  width: min(340px, 95%);
  box-shadow: 7px 8px #09271e;
}
input {
  font: inherit;
  width: 100%;
  padding: 12px;
  border: 3px solid #203329;
  border-radius: 10px;
  text-align: center;
  font-size: 19px;
  touch-action: manipulation;
}
button {
  font: 900 23px system-ui;
  background: #ffcc45;
  color: #1b2923;
  border: 3px solid #1b2923;
  border-radius: 14px;
  padding: 13px;
  width: 100%;
  margin-top: 14px;
  box-shadow: 0 5px #a46d22;
  touch-action: manipulation;
  cursor: pointer;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 2px #a46d22;
}
.hint {
  font-weight: 800;
  font-size: 13px;
  line-height: 1.7;
  margin-top: 22px;
}
.logo {
  font-size: 100px;
  filter: drop-shadow(0 8px 0 #09271e);
}
#hud {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: 10px;
  right: 10px;
  z-index: 3;
  pointer-events: none;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 5px;
}
.stat {
  background: #fff2d2;
  color: #203329;
  border: 2px solid #203329;
  border-radius: 10px;
  padding: 6px 8px;
  min-width: 0;
  text-align: center;
  flex: 1;
}
.stat small {
  display: block;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
}
.stat strong {
  font-size: clamp(14px, 4vw, 23px);
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
}
#track {
  height: 13px;
  border: 2px solid #fff2d2;
  background: #09261e;
  border-radius: 10px;
  margin-top: 9px;
  overflow: hidden;
}
#bar {
  background: #ffcc45;
  width: 100%;
  height: 100%;
}
#pause {
  position: absolute;
  z-index: 4;
  bottom: 18px;
  right: 15px;
  width: auto;
  font-size: 18px;
  padding: 8px 15px;
  background: #fff2d2;
}
#pauseScreen {
  background: #08251fdc;
  z-index: 6;
}
#pauseScreen button { max-width: 260px; }
#final {
  font-size: 75px;
  font-weight: 1000;
  color: #14523c;
}
#record {
  font-weight: 900;
  color: #b83e32;
  min-height: 24px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="stats">
    <div class="stat">
      <small>PLAYER</small>
      <strong id="player">YOU</strong>
    </div>
    <div class="stat">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>BEST</small>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <small>TIME</small>
      <strong id="time">45</strong>
    </div>
  </div>
  <div id="track"><div id="bar"></div></div>
</div>

<button id="pause" class="hidden">Ⅱ</button>

<div class="screen" id="start">
  <div style="letter-spacing:3px;font-size:12px;
    font-weight:900;color:#ffce49">
    THE STOUT ARCADE PRESENTS
  </div>
  <h1>WHACK<br><span>A PINT!</span></h1>
  <div class="logo">🍺</div>
  <div class="panel">
    <label for="name"
      style="display:block;font-weight:900;margin-bottom:10px">
      WHAT'S YOUR FIRST NAME?
    </label>
    <input id="name" maxlength="14"
      placeholder="Enter your name"
      autocomplete="given-name">
    <button id="play">PLAY! ▶</button>
  </div>
  <div class="hint">
    WHACK THE BEAMISH PINTS!<br>
    TAP • SWIPE • CLICK • KEYBOARD
  </div>
</div>

<div class="screen hidden" id="over">
  <h1>TIME'S <span>UP!</span></h1>
  <div class="panel">
    <b id="greeting">FAIR PLAY!</b>
    <div id="final">0</div>
    <b>POINTS SCORED</b>
    <p id="record"></p>
    <p>PERSONAL BEST: <b id="finalBest">0</b></p>
    <button id="again">PLAY AGAIN ↻</button>
    <button id="menu" style="background:white">
      MAIN MENU
    </button>
  </div>
</div>

<div class="screen hidden" id="pauseScreen">
  <h1>PAUSED</h1>
  <button id="resume" style="max-width:260px">
    RESUME ▶
  </button>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const c = $("game");
  const g = c.getContext("2d");
  const TAU = Math.PI * 2;

  let W = 0, H = 0, dpr = 1;
  let mode = "menu";
  let score = 0, best = 0;
  let name = "CHAMP";
  let time = 45, elapsed = 0, spawn = 0, last = 0;
  let pints = [], bits = [], labels = [], rings = [];
  let audio = null, down = false;

  // Progressive blur: increases for every pint whacked.
  let pintsWhacked = 0;
  const BLUR_PER_PINT = 0.22;
  const MAX_BLUR = 8;

  let cursor = { x: 0, y: 0, show: false };
  const keys = new Set();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  try {
    best = +localStorage.getItem("beamishWhackBest") || 0;
    $("name").value =
      localStorage.getItem("beamishWhackName") || "";
  } catch (e) {}

  function resize() {
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = W * dpr;
    c.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  addEventListener("resize", resize);
  resize();

  // Sound effects generated in JavaScript.
  function sound(f = 400, d = .12, slide = 100) {
    if (!audio) return;
    try {
      let t = audio.currentTime;
      let o = audio.createOscillator();
      let v = audio.createGain();

      o.type = "triangle";
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(
        Math.max(30, f + slide), t + d
      );
      v.gain.setValueAtTime(.085, t);
      v.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(v);
      v.connect(audio.destination);
      o.start(t);
      o.stop(t + d);
    } catch (e) {}
  }

  function unlock() {
    try {
      if (!audio) {
        audio = new (
          window.AudioContext || window.webkitAudioContext
        )();
      }
      audio.resume();
    } catch (e) {}
  }

  function hud() {
    $("score").textContent = score;
    $("best").textContent = Math.max(best, score);
    $("time").textContent = Math.ceil(time);
    $("bar").style.width = (time / 45 * 100) + "%";
    $("bar").style.background =
      time < 10 ? "#f0654c" : "#ffcc45";
  }

  function updateBlur() {
    const amount = Math.min(
      MAX_BLUR,
      pintsWhacked * BLUR_PER_PINT
    );
    c.style.filter = `blur(${amount.toFixed(2)}px)`;
  }

  function resetBlur() {
    pintsWhacked = 0;
    c.style.filter = "blur(0px)";
  }

  function begin() {
    unlock();
    name = $("name").value.trim().slice(0, 14) || "CHAMP";

    try {
      localStorage.setItem("beamishWhackName", name);
    } catch (e) {}

    score = 0;
    resetBlur();
    time = 45;
    elapsed = 0;
    spawn = .2;
    pints = [];
    bits = [];
    labels = [];
    rings = [];
    cursor.show = false;
    mode = "playing";

    $("player").textContent = name.toUpperCase();
    $("start").classList.add("hidden");
    $("over").classList.add("hidden");
    $("pauseScreen").classList.add("hidden");
    $("hud").classList.remove("hidden");
    $("pause").classList.remove("hidden");

    hud();
    sound(440, .2, 400);
  }

  function finish() {
    mode = "over";
    sound(400, .45, -250);

    const record = score > best;
    if (record) {
      best = score;
      try {
        localStorage.setItem("beamishWhackBest", best);
      } catch (e) {}
    }

    $("greeting").textContent =
      "FAIR PLAY, " + name.toUpperCase() + "!";
    $("final").textContent = score;
    $("record").textContent =
      record ? "★ NEW PERSONAL BEST! ★" : "GREAT CRAIC!";
    $("finalBest").textContent = best;
    $("hud").classList.add("hidden");
    $("pause").classList.add("hidden");
    $("over").classList.remove("hidden");
  }

  function pause() {
    if (mode === "playing") {
      mode = "paused";
      $("pauseScreen").classList.remove("hidden");
    } else if (mode === "paused") {
      mode = "playing";
      $("pauseScreen").classList.add("hidden");
      last = performance.now();
    }
  }

  $("play").onclick = begin;
  $("again").onclick = begin;
  $("resume").onclick = pause;
  $("pause").onclick = pause;

  $("menu").onclick = () => {
    mode = "menu";
    resetBlur();
    $("over").classList.add("hidden");
    $("start").classList.remove("hidden");
  };

  $("name").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      $("name").blur();
      begin();
    }
  });

  function makePint() {
    const r = clamp(W * .105, 30, 47);
    let x = r + 10, y = H / 2;
    const top = Math.min(
      H * .35, Math.max(145, H * .23)
    );
    const bottom = Math.max(top + 20, H - 125);

    for (let i = 0; i < 15; i++) {
      x = rnd(r + 10, Math.max(r + 11, W - r - 10));
      y = rnd(top, Math.max(top + 1, bottom));
      if (pints.every(p =>
        Math.hypot(p.x - x, p.y - y) > r * 1.75
      )) break;
    }

    const dif = elapsed / 45;
    pints.push({
      x, y, r,
      age: 0,
      life: Math.max(.7, rnd(1.5, 2.1) - dif * .9),
      gold: Math.random() < .1 + dif * .07,
      phase: rnd(0, TAU),
      vx: rnd(-25, 25) * dif,
      vy: rnd(-20, 20) * dif
    });
  }

  function hit(x, y, swipe = false) {
    if (mode !== "playing") return;

    for (let i = pints.length - 1; i >= 0; i--) {
      const p = pints[i];

      if (Math.hypot(x - p.x, y - p.y) < p.r * 1.2) {
        const points = p.gold ? 5 : 1;
        score += points;

        // One successful whack = one extra blur level.
        pintsWhacked++;
        updateBlur();

        labels.push({
          x: p.x,
          y: p.y - 25,
          text: "+" + points,
          age: 0,
          gold: p.gold
        });

        for (let j = 0; j < 20; j++) {
          const a = rnd(0, TAU);
          const s = rnd(60, 230);
          bits.push({
            x: p.x, y: p.y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 70,
            age: 0,
            life: rnd(.3, .8),
            size: rnd(2, 8),
            color: p.gold
              ? "#ffda49"
              : ["#fff3d3", "#dca35b", "#b42f2b"][j % 3]
          });
        }

        pints.splice(i, 1);
        sound(p.gold ? 760 : 390, .13,
              p.gold ? 440 : 180);
        hud();
        return;
      }
    }

    if (!swipe) {
      rings.push({ x, y, age: 0 });
      sound(170, .08, -90);
    }
  }

  function pos(e) {
    const b = c.getBoundingClientRect();
    return {
      x: e.clientX - b.left,
      y: e.clientY - b.top
    };
  }

  c.addEventListener("pointerdown", e => {
    if (mode !== "playing") return;
    e.preventDefault();
    unlock();
    down = true;
    try { c.setPointerCapture(e.pointerId); }
    catch (err) {}
    const p = pos(e);
    hit(p.x, p.y);
  });

  c.addEventListener("pointermove", e => {
    if (!down || mode !== "playing") return;
    e.preventDefault();
    const p = pos(e);
    hit(p.x, p.y, true);
  });

  c.addEventListener("pointerup", () => down = false);
  c.addEventListener("pointercancel", () => down = false);

  addEventListener("keydown", e => {
    if (document.activeElement === $("name")) return;
    const k = e.key.toLowerCase();

    if ([" ", "enter", "arrowup", "arrowdown",
         "arrowleft", "arrowright"].includes(k)) {
      e.preventDefault();
    }
    keys.add(k);

    if (mode === "playing" &&
        (k === " " || k === "enter")) {
      unlock();
      if (!cursor.show) {
        cursor.x = W / 2;
        cursor.y = H / 2;
      }
      cursor.show = true;
      hit(cursor.x, cursor.y);
    }

    if (k === "escape" || k === "p") pause();
  });

  addEventListener("keyup", e =>
    keys.delete(e.key.toLowerCase())
  );

  addEventListener("blur", () => {
    down = false;
    if (mode === "playing") pause();
  });

  function background(t) {
    const grad = g.createRadialGradient(
      W / 2, H * .43, 0,
      W / 2, H * .43, H * .8
    );
    grad.addColorStop(0, "#357e54");
    grad.addColorStop(1, "#103b30");
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    g.strokeStyle = "#f6df9b16";
    g.lineWidth = 2;
    for (let x = -H; x < W + H; x += 42) {
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x + H * .35, H);
      g.stroke();
    }

    g.strokeStyle = "#0b2b23";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, H * .13);
    g.quadraticCurveTo(W / 2, H * .21, W, H * .13);
    g.stroke();

    for (let i = 0; i < 8; i++) {
      const x = W * (i + .5) / 8;
      const y = H * (.13 + .07 *
        (1 - Math.pow((x - W / 2) / (W / 2), 2)));
      g.beginPath();
      g.arc(x, y, 4, 0, TAU);
      g.fillStyle = "#ffd66a";
      g.shadowColor = "#ffd66a";
      g.shadowBlur = 13;
      g.fill();
      g.shadowBlur = 0;
    }

    g.save();
    g.globalAlpha = .12;
    g.strokeStyle = "#ffe4a4";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(W / 2, H * .48,
      Math.min(W * .35, 145), 0, TAU);
    g.stroke();
    g.fillStyle = "#fff0c4";
    g.textAlign = "center";
    g.font =
      `900 ${Math.min(33, W * .09)}px system-ui`;
    g.fillText("THE STOUT", W / 2, H * .46);
    g.fillText("HOUSE", W / 2, H * .51);
    g.restore();

    g.fillStyle = "#673d26";
    g.fillRect(0, H - 78, W, 78);
    g.fillStyle = "#d08c4c";
    g.fillRect(0, H - 78, W, 14);
    g.fillStyle = "#f3b65f";
    g.fillRect(0, H - 78, W, 4);
  }

  // Draw Beamish stout pint.
  function pint(p, t) {
    const fade = Math.min(
      1, p.age / .13, (p.life - p.age) / .2
    );
    const s = p.r / 44 * Math.max(.01, fade);

    g.save();
    g.translate(
      p.x, p.y + Math.sin(t * 4 + p.phase) * 3
    );
    g.rotate(Math.sin(t * 4 + p.phase) * .055);
    g.scale(s, s);

    if (p.gold) {
      g.shadowColor = "#ffda49";
      g.shadowBlur = 23;
    }

    g.beginPath();
    g.moveTo(-35, -30);
    g.lineTo(35, -30);
    g.lineTo(29, 40);
    g.quadraticCurveTo(0, 49, -29, 40);
    g.closePath();

    const beer = g.createLinearGradient(-35, 0, 35, 0);
    beer.addColorStop(0,
      p.gold ? "#9b5119" : "#4b2b20");
    beer.addColorStop(.5,
      p.gold ? "#cf8a24" : "#100d0d");
    beer.addColorStop(1,
      p.gold ? "#f0ba40" : "#472419");

    g.fillStyle = beer;
    g.fill();
    g.shadowBlur = 0;
    g.strokeStyle = "#f4dfb7";
    g.lineWidth = 3;
    g.stroke();

    // Creamy head.
    g.beginPath();
    g.moveTo(-37, -29);
    g.bezierCurveTo(-44, -43, -28, -52, -19, -45);
    g.bezierCurveTo(-10, -57, 2, -55, 9, -47);
    g.bezierCurveTo(22, -55, 32, -48, 35, -40);
    g.bezierCurveTo(45, -35, 38, -26, 30, -27);
    g.quadraticCurveTo(0, -20, -37, -29);
    g.fillStyle = "#f7e7c5";
    g.fill();
    g.strokeStyle = "#fff9e9";
    g.lineWidth = 2;
    g.stroke();

    // Glass reflection.
    g.strokeStyle = "#ffffff55";
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(-25, -12);
    g.lineTo(-21, 27);
    g.stroke();

    // Beamish label.
    g.fillStyle = p.gold ? "#81521a" : "#b2322b";
    g.fillRect(-27, -1, 54, 31);
    g.strokeStyle = "#e7c898";
    g.lineWidth = 1;
    g.strokeRect(-27, -1, 54, 31);

    g.fillStyle = "#fff3da";
    g.textAlign = "center";
    g.font = "bold 12px Georgia, serif";
    g.fillText("BEAMISH", 0, 13);
    g.font = "bold 7px system-ui";
    g.fillText("STOUT", 0, 23);

    if (p.gold) {
      g.fillStyle = "#ffdf52";
      g.font = "22px system-ui";
      g.fillText("★", 0, -58);
    }

    // Time remaining around the pint.
    g.beginPath();
    g.arc(
      0, -3, 54,
      -Math.PI / 2,
      -Math.PI / 2 +
        TAU * Math.max(0, 1 - p.age / p.life)
    );
    g.strokeStyle =
      p.gold ? "#ffdb55" : "#fff0d5";
    g.lineWidth = 3;
    g.stroke();
    g.restore();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000 || 0, .05);
    last = now;

    if (mode === "playing") {
      time = Math.max(0, time - dt);
      elapsed += dt;
      spawn -= dt;

      if (spawn <= 0) {
        if (pints.length < 9) makePint();
        spawn = Math.max(
          .27, .9 - elapsed / 45 * .58
        ) * rnd(.75, 1.15);

        if (elapsed > 25 &&
            Math.random() < .2 &&
            pints.length < 9) {
          makePint();
        }
      }

      for (let i = pints.length - 1; i >= 0; i--) {
        const p = pints[i];
        p.age += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.x < p.r || p.x > W - p.r)
          p.vx *= -1;
        if (p.y < 145 || p.y > H - 110)
          p.vy *= -1;
        if (p.age >= p.life)
          pints.splice(i, 1);
      }

      const speed = 290;

      if (keys.has("arrowleft") || keys.has("a")) {
        cursor.x -= speed * dt;
        cursor.show = true;
      }
      if (keys.has("arrowright") || keys.has("d")) {
        cursor.x += speed * dt;
        cursor.show = true;
      }
      if (keys.has("arrowup") || keys.has("w")) {
        cursor.y -= speed * dt;
        cursor.show = true;
      }
      if (keys.has("arrowdown") || keys.has("s")) {
        cursor.y += speed * dt;
        cursor.show = true;
      }

      cursor.x = clamp(cursor.x, 15, W - 15);
      cursor.y = clamp(cursor.y, 140, H - 90);

      hud();
      if (time <= 0) finish();
    }

    background(now / 1000);

    if (mode === "playing" || mode === "paused") {
      pints.forEach(p => pint(p, now / 1000));

      // Flying foam particles.
      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        if (mode === "playing") {
          b.age += dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.vy += 360 * dt;
        }
        if (b.age >= b.life) {
          bits.splice(i, 1);
          continue;
        }
        g.globalAlpha = 1 - b.age / b.life;
        g.fillStyle = b.color;
        g.fillRect(b.x, b.y, b.size, b.size);
        g.globalAlpha = 1;
      }

      // Floating score labels.
      for (let i = labels.length - 1; i >= 0; i--) {
        const l = labels[i];
        if (mode === "playing") {
          l.age += dt;
          l.y -= 45 * dt;
        }
        if (l.age > .85) {
          labels.splice(i, 1);
          continue;
        }
        g.globalAlpha = 1 - l.age / .85;
        g.fillStyle = l.gold ? "#ffdf51" : "white";
        g.strokeStyle = "#173b2d";
        g.lineWidth = 4;
        g.font = "900 27px system-ui";
        g.textAlign = "center";
        g.strokeText(l.text, l.x, l.y);
        g.fillText(l.text, l.x, l.y);
        g.globalAlpha = 1;
      }

      // Miss ripple effects.
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        if (mode === "playing") r.age += dt;
        if (r.age > .3) {
          rings.splice(i, 1);
          continue;
        }
        g.beginPath();
        g.arc(r.x, r.y, 8 + r.age * 75, 0, TAU);
        g.strokeStyle =
          `rgba(255,244,210,${1 - r.age / .3})`;
        g.lineWidth = 3;
        g.stroke();
      }

      // Keyboard crosshair.
      if (cursor.show) {
        g.strokeStyle = "#ffdf51";
        g.lineWidth = 3;
        g.beginPath();
        g.arc(cursor.x, cursor.y, 17, 0, TAU);
        g.moveTo(cursor.x - 25, cursor.y);
        g.lineTo(cursor.x - 9, cursor.y);
        g.moveTo(cursor.x + 9, cursor.y);
        g.lineTo(cursor.x + 25, cursor.y);
        g.moveTo(cursor.x, cursor.y - 25);
        g.lineTo(cursor.x, cursor.y - 9);
        g.moveTo(cursor.x, cursor.y + 9);
        g.lineTo(cursor.x, cursor.y + 25);
        g.stroke();
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
